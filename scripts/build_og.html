<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Build the Juke share card</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
  body { margin:0; padding:24px; background:#151413; color:#ECEBEB;
         font-family: Inter, system-ui, sans-serif; }
  canvas { width: 600px; max-width: 100%; display:block; border-radius:8px; }
  a.dl { display:inline-block; margin-top:16px; background:#0F7C8E; color:#fff;
         text-decoration:none; padding:10px 18px; border-radius:8px; font-weight:600; }
  p { color:#A2B0BE; font-size:14px; max-width:600px; line-height:1.6; }
</style>
</head>
<body>

<!-- Open this file in a browser and click Download, then drop the result in
     the repo root as og-image.png. It carries its own copy of the logo paths,
     so it needs no server and no build step. -->

<p>The 1200 x 630 card used by <code>og:image</code>. Click download, then save
   the file into the repo root as <code>og-image.png</code>.</p>

<canvas id="c" width="1200" height="630"></canvas>
<a class="dl" id="dl" download="og-image.png">Download og-image.png</a>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="m" viewBox="0 0 662 774">

53 L 332 565 L 313 578 L 297 588 L 273 598 L 240 565 Z"/>

<script>
const NAVY = '#152A49', WHITE = '#FFFFFF', TEAL = '#00E5FF', MUTED = '#9DB2C9';
const TAGLINE = 'Fantasy football mock drafts, free and without an account';

(async () => {
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 662 774">' +
              document.getElementById('m').innerHTML + '</svg>';
  const img = await new Promise(r => { const i = new Image();
    i.onload = () => r(i); i.src = URL.createObjectURL(new Blob([svg], {type:'image/svg+xml'})); });

  await document.fonts.load('700 112px "Barlow Condensed"');
  await document.fonts.load('500 34px Inter');
  await document.fonts.ready;

  const c = document.getElementById('c'), x = c.getContext('2d');
  x.fillStyle = NAVY; x.fillRect(0, 0, 1200, 630);

  const markH = 200, markW = Math.round(markH * 662 / 774);
  x.font = '700 112px "Barlow Condensed", sans-serif';
  const gap = 34, total = markW + gap + x.measureText('JUKE').width;
  const startX = (1200 - total) / 2, midY = 285;

  x.drawImage(img, Math.round(startX), Math.round(midY - markH / 2), markW, markH);
  x.fillStyle = WHITE; x.textBaseline = 'middle';
  x.fillText('JUKE', Math.round(startX + markW + gap), midY + 4);

  x.fillStyle = TEAL; x.fillRect(560, 424, 80, 5);
  x.fillStyle = MUTED; x.font = '500 34px Inter, sans-serif'; x.textAlign = 'center';
  x.fillText(TAGLINE, 600, 494);

  document.getElementById('dl').href = c.toDataURL('image/png');
})();
</script>
</body>
</html>
