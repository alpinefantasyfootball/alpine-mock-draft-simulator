<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Draft Room</title>

  <!-- The theme is set before anything paints, rather than in app.js at the
       foot of the body, because by then the page has already been drawn: a
       reader who chose light would watch it flash dark first. No stored
       choice means no attribute, and no attribute means the dark default
       that lives in :root. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("draftroom.theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      } catch (err) {}   // private browsing can make localStorage throw
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Draft Room">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" href="favicon.ico" sizes="any">
</head>
<body>

  <!-- ============ EVERYTHING THAT STAYS PINNED TO THE TOP ============ -->
  <div class="sticky-top">

    <header class="appbar" id="appbar">

      <!-- The mark doubles as the way home, which is where every site puts it.
           This is the app icon itself — the same peak, the same four facets
           and the same laces someone would have tapped to open the app — so
           the header and the home screen agree on what this thing is. The
           header sits on the icon's own navy, which is why the mark needs no
           background of its own.
           width and height are set here as well as in the CSS so the shape
           can never balloon if the stylesheet is slow, missing or cached. -->
      <button class="home" id="homeBtn" type="button" title="Back to draft setup"
              aria-label="Back to draft setup">
        <svg class="mark" width="34" height="34" viewBox="56 72 400 400"
             aria-hidden="true" focusable="false">
          <clipPath id="peakClip"><path d="M256 102 L447 441 L65 441 Z"/></clipPath>
          <g clip-path="url(#peakClip)">
            <rect x="56"  y="72"  width="200" height="219" fill="#FFFFFF"/>
            <rect x="256" y="72"  width="200" height="219" fill="#DFE7EF"/>
            <rect x="56"  y="291" width="200" height="181" fill="#ECEAE3"/>
            <rect x="256" y="291" width="200" height="181" fill="#B9C5D3"/>
          </g>
          <g fill="#D8622C">
            <rect x="250" y="250" width="12"  height="166" rx="6"/>
            <rect x="214" y="273" width="84"  height="12"  rx="6"/>
            <rect x="209" y="319" width="94"  height="12"  rx="6"/>
            <rect x="204" y="365" width="104" height="12"  rx="6"/>
          </g>
        </svg>
      </button>

      <div class="appbar-text">
        <h1 id="statusLine">The Draft Room</h1>
        <p id="pickLabel" hidden></p>
      </div>

      <!-- The counter carries the pick clock and the wait until your turn, so
           it is worth its place once a draft is running and worth nothing
           before one. It stays hidden on the setup screen; the theme toggle
           does not, because that is the one header control that is always
           useful. -->
      <div class="appbar-right">
        <div class="count" id="countBlock" hidden>
          <span class="count-label" id="rightLabel">Players</span>
          <span class="count-value" id="rightValue"></span>
        </div>

        <button class="theme-toggle" id="themeBtn" type="button" aria-pressed="true">
          <svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4.2"/>
            <path d="M12 2.4v2.2M12 19.4v2.2M4.2 12H2M22 12h-2.2M6.5 6.5 4.9 4.9M19.1 19.1l-1.6-1.6M17.5 6.5l1.6-1.6M4.9 19.1l1.6-1.6"/>
          </svg>
          <svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.5 14.9A8.7 8.7 0 0 1 9.1 3.5a8.7 8.7 0 1 0 11.4 11.4Z" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </header>

    <nav class="tabs" id="tabs" hidden>
      <button class="on" data-tab="tab-suggest">Suggestions</button>
      <button data-tab="tab-players">Players</button>
      <button data-tab="tab-board">Draft Board</button>
      <button data-tab="tab-team">My Team</button>
      <button data-tab="tab-picks">Picks</button>
      <button data-tab="tab-grades">Analysis</button>
    </nav>

    <!-- The first three only mean anything while a draft is running, so they
         are swapped for the way out once it finishes. -->
    <div class="actionbar" id="actionbar" hidden>
      <button class="mini go" data-action="new-draft" id="newDraftBtn" hidden>New mock draft</button>
      <button class="mini" id="pauseBtn">Pause clock</button>
      <button class="mini" id="undoBtn">Undo</button>
      <button class="mini" id="autoBtn">Auto-draft the rest</button>
      <button class="mini danger" id="restartBtn">Discard draft</button>
    </div>

    <div class="ticker" id="ticker" hidden></div>

  </div>

  <main>

    <!-- ---------- SETUP ---------- -->
    <section class="panel on" id="tab-setup">
      <div class="resume" id="resumeBar" hidden></div>

      <div class="setup">
        <h2>Draft setup</h2>

        <div class="field">
          <label for="draftSlot">Draft position</label>
          <div class="field-row">
            <select id="draftSlot"></select>
            <button class="ghost" id="randomizeBtn">Randomize</button>
          </div>
        </div>

        <div class="field">
          <label for="pickClock">Pick clock</label>
          <select id="pickClock">
            <option value="0">None</option>
            <option value="30">30 seconds</option>
            <option value="45">45 seconds</option>
            <option value="60" selected>60 seconds</option>
            <option value="120">120 seconds</option>
          </select>
          <p class="hint">When the clock runs out, the top suggestion is drafted for you. You can pause it at any time once the draft starts.</p>
        </div>

        <div class="field">
          <label for="teamCount">League</label>
          <div class="field-row">
            <select id="teamCount">
              <option value="8">8 teams</option>
              <option value="10" selected>10 teams</option>
              <option value="12">12 teams</option>
              <option value="14">14 teams</option>
            </select>
            <select id="roundCount"></select>
            <select id="scoring">
              <option value="standard">Standard</option>
              <option value="half" selected>Half PPR</option>
              <option value="ppr">Full PPR</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label>Starting lineup</label>
          <div class="field-row">
            <select id="startQB"></select>
            <select id="startRB"></select>
            <select id="startWR"></select>
          </div>
          <div class="field-row" style="margin-top:8px">
            <select id="startTE"></select>
            <select id="startFLEX"></select>
            <select id="startDST"></select>
          </div>
          <div class="field-row" style="margin-top:8px">
            <select id="startK"></select>
            <select id="benchCount"></select>
          </div>
          <p class="hint" id="rosterSum"></p>
        </div>

        <!-- Collapsed by default. Thirty-eight numbers would swamp a setup
             screen that most people never need to touch, but every one of
             them is here for the leagues that do. -->
        <details class="scoring" id="scoringBox">
          <summary>
            <span>Scoring</span>
            <span class="scoring-sum" id="scoringSummary"></span>
          </summary>
          <div id="scoringFields"></div>
          <button class="ghost" type="button" id="resetScoring">Reset to defaults</button>
        </details>

        <button class="primary big" id="startBtn">Start Your Draft</button>
        <p class="freshness" id="freshness"></p>
        <p class="freshness"><a href="docs/draft-room-how-it-works.html">How the Draft Room works</a></p>
      </div>
    </section>

    <!-- ---------- SUGGESTIONS ---------- -->
    <section class="panel" id="tab-suggest">
      <div class="pos-filter" id="suggestFilter">
        <button class="on" data-pos="ALL">All</button>
        <button data-pos="QB">QB</button>
        <button data-pos="RB">RB</button>
        <button data-pos="WR">WR</button>
        <button data-pos="TE">TE</button>
        <button data-pos="K">K</button>
        <button data-pos="DST">DST</button>
      </div>
      <div id="suggestList"></div>
    </section>

    <!-- ---------- PLAYERS ---------- -->
    <section class="panel" id="tab-players">
      <div class="toolbar">
        <input type="search" id="playerSearch" placeholder="Search players or teams" autocomplete="off">
        <label class="check">
          <input type="checkbox" id="hideDrafted">
          <span>Hide drafted</span>
        </label>
      </div>

      <div class="pos-filter" id="playerFilter">
        <button class="on" data-pos="ALL">All</button>
        <button data-pos="QB">QB</button>
        <button data-pos="RB">RB</button>
        <button data-pos="WR">WR</button>
        <button data-pos="TE">TE</button>
        <button data-pos="K">K</button>
        <button data-pos="DST">DST</button>
      </div>

      <table id="playerTable">
        <thead>
          <tr>
            <th>Player</th>
            <th class="num">Rank</th>
            <th class="num">ADP</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- ---------- DRAFT BOARD ---------- -->
    <section class="panel" id="tab-board">
      <div class="board-scroll"><div class="board" id="boardGrid"></div></div>
      <div class="legend">
        <span><i class="sw QB"></i>QB</span><span><i class="sw RB"></i>RB</span>
        <span><i class="sw WR"></i>WR</span><span><i class="sw TE"></i>TE</span>
        <span><i class="sw K"></i>K</span><span><i class="sw DST"></i>D/ST</span>
      </div>
    </section>

    <!-- ---------- MY TEAM ---------- -->
    <section class="panel" id="tab-team">
      <p class="section-label">Starters</p>
      <ul class="roster" id="startersList"></ul>
      <p class="section-label">Bench</p>
      <ul class="roster" id="benchList"></ul>
    </section>

    <!-- ---------- ANALYSIS ---------- -->
    <section class="panel" id="tab-grades">
      <div id="gradesBody"></div>
    </section>

    <!-- ---------- PICKS ---------- -->
    <section class="panel" id="tab-picks">
      <div id="picksList"></div>
    </section>

  </main>

  <!-- ============ PLAYER DETAIL ============ -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <div class="sheet" id="sheet" hidden>
    <div class="sheet-head" id="sheetHead"></div>
    <nav class="sheet-tabs" id="sheetTabs">
      <button class="on" data-view="v-overview">Overview</button>
      <button data-view="v-logs">Game Logs</button>
      <button data-view="v-seasons">Seasons</button>
      <button data-view="v-depth">Depth Chart</button>
    </nav>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <script src="players.js"></script>
  <script src="stats.js"></script>
  <script src="app.js"></script>
</body>
</html>
