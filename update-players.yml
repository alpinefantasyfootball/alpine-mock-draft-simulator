name: Update player data

# Two ways this runs:
#   schedule          — every morning at 11:00 UTC (6am Central)
#   workflow_dispatch — a "Run workflow" button on the Actions tab,
#                       which is how you test it without waiting a day
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

# The job commits back to this repository, so it needs write access.
# Without this line the push at the end fails with a 403.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild players.js
        run: python scripts/build_players.py

      - name: Commit if anything changed
        run: |
          git config user.name  "alpine-draft-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add players.js unmatched.txt
          # --quiet exits non-zero when there ARE changes, so the || is what
          # lets the job succeed on a day when nothing moved.
          git diff --staged --quiet || git commit -m "Update player data ($(date -u +%Y-%m-%d))"
          git push
