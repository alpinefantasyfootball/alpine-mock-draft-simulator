name: Update player data

# Two ways this runs:
#   schedule          — every morning at 11:00 UTC (6am Central)
#   workflow_dispatch — a "Run workflow" button on the Actions tab,
#                       which is how you test it without waiting a day
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

# The job commits back to this repository, so it needs write access.
# Without this line the push at the end fails with a 403.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild players.js
        run: python scripts/build_players.py

      - name: Commit if anything changed
        run: |
          git config user.name  "alpine-draft-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add players.js stats.js unmatched.txt

          # --quiet exits non-zero when there ARE changes, so this is the
          # early exit on a day when nothing moved.
          if git diff --staged --quiet; then
            echo "No change in the feeds today; nothing to commit."
            exit 0
          fi

          # The generated files are cached for four hours by the CDN, so new
          # data behind an unchanged address is data nobody sees until the
          # afternoon. Bumping the stamp is what actually ships the rebuild —
          # see the note beside ?v= in index.html. Down to the minute, because
          # this workflow also has a Run button and can fire twice in a day.
          STAMP=$(date -u +%Y%m%d%H%M)
          sed -i -E "s/\?v=[0-9A-Za-z._-]+/?v=$STAMP/g" \
            index.html docs/draft-room-how-it-works.html
          git add index.html docs/draft-room-how-it-works.html

          git commit -m "Update player data ($(date -u +%Y-%m-%d))"
          git push
