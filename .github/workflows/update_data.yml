name: Update expected-points data

# Two ways this runs, same shape as update-players.yml:
#   schedule          — Tuesdays at 6:00 UTC, after ffopportunity's own
#                       weekly refresh has had the weekend's games land
#   workflow_dispatch — a "Run workflow" button on the Actions tab
on:
  schedule:
    - cron: "0 6 * * 2"
  workflow_dispatch:

# The job commits back to this repository, so it needs write access.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch the newest ep_weekly CSV
        run: python scripts/fetch_ffopportunity.py
        env:
          # Only for the API rate limit; the script works without it.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if anything changed
        run: |
          git config user.name  "alpine-draft-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data

          # --quiet exits non-zero when there ARE changes, so this is the
          # early exit on a week when the model output has not moved --
          # which is every week of the offseason.
          if git diff --staged --quiet; then
            echo "No change in the expected-points data this week."
            exit 0
          fi

          # Deliberately NO ?v= bump, unlike update-players.yml: nothing any
          # page loads references src/data/, so there is no cached address to
          # move. The CSV is pipeline input, not a served asset -- Cloudflare
          # Pages builds from web/ and this directory is in neither
          # LEGACY_FILES nor web/public/.
          git commit -m "Update expected-points data ($(date -u +%Y-%m-%d))"
          git push
