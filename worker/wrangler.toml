name = "juke-draft-room"
main = "draft-room.js"
compatibility_date = "2026-08-14"

# One Durable Object per draft room. The invite link carries the room's
# name, idFromName() turns that name into the same object for everyone who
# follows the link, and that object is the only thing that decides what
# happened in the draft.
[[durable_objects.bindings]]
name = "DRAFT_ROOM"
class_name = "DraftRoom"

# Durable Objects have to be introduced in a migration the first time.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["DraftRoom"]

# The cache database. Player pool and headlines, so the two upstream feeds
# are asked as rarely as we can manage — Tank01's free tier is a thousand
# calls a month, which one sweep of the board would spend a fifth of.
#
# Nothing the page renders comes from here. players.js and stats.js are still
# the board, still generated nightly, still the version a room pins itself to.
#
# `migrations_dir` is D1's, and is not the [[migrations]] block above: that one
# introduces a Durable Object class and has nothing to do with SQL. Two
# unrelated things with one name, in one file — read the section header.
[[d1_databases]]
binding = "DB"
database_name = "juke_db"
database_id = "89995115-4083-4dc6-ad4a-0344345a1205"
migrations_dir = "migrations"

# Chat attachments: voice notes and photos. Neither belongs in the Durable
# Object (a room's storage value has a hard ceiling, and the whole room —
# league, picks, chat — is written to it on every action; a recording is
# real binary payload, not the couple of hundred lines of text the chat log
# is bounded to) or in D1 (a cache of somebody else's data, and an upload
# is the opposite of that — it exists nowhere but here). R2 is the piece of
# Cloudflare storage built for exactly this, and draft-room.js serves it
# back out itself from /media/<key> rather than through R2's own
# public-bucket URL — see that route's own comment for why.
#
# MANUAL STEP, the same shape as GIPHY_KEY and TANK01_KEY being set with
# `wrangler secret put` (see worker/README.md): this binding does nothing
# until the bucket exists. From an account with R2 enabled, once:
#   wrangler r2 bucket create juke-chat-media
#   wrangler deploy
# See "Chat media (voice and photos)" in worker/README.md.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "juke-chat-media"

# The pool sync, armed — and this comment is the note it asked for.
#
# It stayed commented out because "nothing reads the players table yet ...
# uncomment it in the change that adds the first consumer, so the cost and
# the thing paying for it land together". ESPN is that consumer:
# resolveSleeperIds() joins an ESPN roster to Sleeper ids through this
# table, and without a filled pool a connected ESPN league renders ten
# empty rosters.
#
# Half past, because scripts/build_players.py runs at 11:00 UTC and there is
# no reason for the two to fetch Sleeper in the same minute. They are
# independent — this one failing does not touch the generated files.
#
# The cost is what that note said it was: a nightly 5MB fetch, a full parse
# and ~4,400 upserts (the pool is filtered to fantasy positions, so it is not
# the ~11,000 the note estimated). The parse is still the thing in this
# worker most likely to trip a CPU limit, and syncPlayerPool() logs rather
# than throws for that reason.
#
# A fresh deployment does not wait for it: espnSnapshotRoute() fills the pool
# off the response path the first time it finds it empty, so the feature
# heals within a couple of minutes rather than at 11:30 tomorrow.
[triggers]
crons = ["30 11 * * *"]

# The site moved to Cloudflare Pages on 18 August 2026; this comment said
# "stays on GitHub Pages" until 6 September and is corrected in place rather
# than left standing. The point it was making is unchanged and is the reason
# it is kept at all: this worker is only the room and the account, so the
# static app keeps working with no backend at all — a solo mock draft must
# not depend on anything being up.
#
# Observability is Workers' own log retention, and it covers this half only.
# The browser has no error reporting of any kind; see CLAUDE.md's system
# section on what that gap has already cost.
[observability]
enabled = true
